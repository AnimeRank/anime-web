<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AnimeRank - Información del anime</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #080808;
            color: white;
        }

        .cabecera {
            background: #111;
            padding: 20px;
            border-bottom: 1px solid #333;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .menu-principal {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .menu-principal a {
            color: white;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
        }

        .menu-principal a:hover {
            background: #222;
        }

        main {
            max-width: 1100px;
            margin: auto;
            padding: 40px 20px;
        }

        .cargando {
            text-align: center;
            font-size: 22px;
            padding: 60px;
        }

        .anime {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 40px;
            background: #111;
            padding: 30px;
            border-radius: 15px;
        }

        .anime img {
            width: 100%;
            border-radius: 10px;
        }

        h1 {
            margin-top: 0;
            font-size: 38px;
        }

        .puntuacion {
            font-size: 22px;
        }

        .datos {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 25px 0;
        }

        .dato {
            background: #1b1b1b;
            padding: 12px;
            border-radius: 8px;
        }

        .generos {
            margin: 20px 0;
        }

        .genero {
            display: inline-block;
            background: #252525;
            padding: 7px 12px;
            margin: 4px;
            border-radius: 20px;
        }

        .sinopsis {
            line-height: 1.7;
            color: #ddd;
        }

        .volver {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 20px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        @media (max-width: 700px) {

            .anime {
                grid-template-columns: 1fr;
            }

            .anime img {
                max-width: 300px;
            }

            h1 {
                font-size: 28px;
            }

            .datos {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

<header class="cabecera">

    <div class="logo">
        AnimeRank
    </div>

    <nav class="menu-principal">

        <a href="../">🏠 Inicio</a>

        <a href="../buscador/">🔎 Buscador</a>

        <a href="../recomendados/">⭐ Recomendados</a>

        <a href="../populares/">🔥 Populares</a>

        <a href="../temporadas/">📅 Temporadas</a>

        <a href="../generos/">🎭 Géneros</a>

        <a href="../traductor/">🌐 Traductor</a>

    </nav>

</header>


<main>

    <div id="resultado" class="cargando">
        🔎 Cargando información del anime...
    </div>

</main>


<script>

async function cargarAnime() {

    const resultado = document.getElementById("resultado");

    const parametros = new URLSearchParams(window.location.search);

    const id = parametros.get("id");

    if (!id) {

        resultado.innerHTML = `
            <h2>No se ha seleccionado ningún anime.</h2>
            <a class="volver" href="../">🏠 Volver a AnimeRank</a>
        `;

        return;
    }

    const query = `
        query ($id: Int) {

            Media(id: $id, type: ANIME) {

                id

                title {
                    romaji
                    english
                    native
                }

                coverImage {
                    large
                }

                bannerImage

                averageScore

                popularity

                episodes

                duration

                season

                seasonYear

                status

                genres

                studios {
                    nodes {
                        name
                    }
                }

                description(asHtml: false)

            }

        }
    `;


    try {

        const respuesta = await fetch("https://graphql.anilist.co", {

            method: "POST",

            headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
            },

            body: JSON.stringify({

                query: query,

                variables: {
                    id: Number(id)
                }

            })

        });


        const datos = await respuesta.json();

        const anime = datos.data.Media;


        if (!anime) {

            resultado.innerHTML = `
                <h2>Anime no encontrado.</h2>
                <a class="volver" href="../">🏠 Volver a AnimeRank</a>
            `;

            return;
        }


        const titulo =
            anime.title.english ||
            anime.title.romaji ||
            anime.title.native ||
            "Sin título";


        const puntuacion =
            anime.averageScore
            ? (anime.averageScore / 10).toFixed(1)
            : "N/A";


        const descripcion =
            anime.description ||
            "No hay sinopsis disponible.";


        const estudios =
            anime.studios.nodes.length > 0
            ? anime.studios.nodes.map(estudio => estudio.name).join(", ")
            : "Desconocido";


        resultado.className = "anime";


        resultado.innerHTML = `

            <div>

                <img
                    src="${anime.coverImage.large}"
                    alt="${titulo}"
                >

            </div>


            <div>

                <h1>${titulo}</h1>

                <p class="puntuacion">
                    ⭐ ${puntuacion}/10
                </p>


                <div class="datos">

                    <div class="dato">
                        📅 Año:
                        ${anime.seasonYear || "Desconocido"}
                    </div>

                    <div class="dato">
                        🎬 Episodios:
                        ${anime.episodes || "?"}
                    </div>

                    <div class="dato">
                        ⏱️ Duración:
                        ${anime.duration ? anime.duration + " min" : "Desconocida"}
                    </div>

                    <div class="dato">
                        📺 Estado:
                        ${anime.status || "Desconocido"}
                    </div>

                    <div class="dato">
                        👥 Popularidad:
                        ${anime.popularity || "Desconocida"}
                    </div>

                    <div class="dato">
                        🎨 Estudio:
                        ${estudios}
                    </div>

                </div>


                <div class="generos">

                    <strong>🎭 Géneros:</strong>

                    <br>

                    ${anime.genres
                        .map(genero => `
                            <span class="genero">
                                ${genero}
                            </span>
                        `)
                        .join("")}

                </div>


                <h2>📖 Sinopsis</h2>

                <p class="sinopsis">
                    ${descripcion}
                </p>


                <a class="volver" href="../">
                    ← Volver a AnimeRank
                </a>

            </div>

        `;


    } catch (error) {

        console.error(error);

        resultado.innerHTML = `
            <h2>❌ No se pudo cargar la información.</h2>
            <p>Inténtalo de nuevo más tarde.</p>
            <a class="volver" href="../">🏠 Volver a AnimeRank</a>
        `;

    }

}


cargarAnime();

</script>


</body>

</html>
